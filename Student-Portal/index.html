<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Smart Learn - Student Portal</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <div class="container-fluid">

        <div class="header">

            <div class="academy-brand">

                <a class="navbar-brand" href="#">
                    <img src="logo.png" alt="" width="200" height="70" class="d-inline-block align-text-top">
                </a>

            </div>

        </div>

        <div id="loginContainer">

            <div class="login-card">

                <h4 class="mb-4 text-center">
                    Student Login
                </h4>

                <div class="mb-3">
                    <label class="form-label">
                        OMR ID
                    </label>

                    <input type="text" id="username" class="form-control" placeholder="Enter OMR ID">
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Registration ID
                    </label>

                    <input type="password" id="password" class="form-control" placeholder="Enter Registration ID">
                </div>

                <button id="loginBtn" class="btn btn-primary w-100">
                    Login
                </button>

                <div id="message" class="mt-3 text-center">
                </div>

            </div>

        </div>

        <div id="dashboard" class="d-none">

            <div class="student-card">

                <h4 class="mb-3">
                    Student Details
                </h4>

                <div id="studentInfo"></div>

            </div>

            <div class="marks-card">

                <div class="row mb-3 align-items-center">

                    <div class="col-md-6">

                        <input type="text" id="searchBox" class="form-control" placeholder="Search test name">

                    </div>

                    <div class="col-md-6 text-md-end mt-2 mt-md-0">

                        <button id="downloadPdfBtn" class="btn btn-success">

                            Download PDF

                        </button>

                    </div>

                </div>
            </div>
            <div class="table-container">
                
                <table class="table table-striped table-hover">

                    <thead>

                        <tr>
                            <th>Subject</th>
                            <th>Test</th>
                            <th>Marks (%)</th>
                        </tr>

                    </thead>

                    <tbody id="marksTableBody"></tbody>

                </table>

            </div>

        </div>

    </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
