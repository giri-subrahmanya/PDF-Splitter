<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Splitter & ZIP Generator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f7fb;
        }

        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .preview-table {
            max-height: 320px;
            overflow-y: auto;
        }

        .header-card {
            background: linear-gradient(135deg, #0d6efd, #4f8cff);
            color: white;
        }

        .status-valid {
            color: green;
            font-weight: 600;
        }

        .status-invalid {
            color: red;
            font-weight: 600;
        }

        textarea {
            min-height: 220px;
        }
    </style>
</head>

<body>

<div class="container py-4">

    <div class="card header-card mb-4">
        <div class="card-body">
            <h2>PDF Splitter & ZIP Generator</h2>
            <p class="mb-0">
                Upload PDF → Paste Google Sheets Data → Generate PDFs → Download ZIP
            </p>
        </div>
    </div>

    <div class="row g-4">

        <div class="col-lg-4">
            <div class="card h-100">
                <div class="card-body">

                    <h5>PDF Upload</h5>

                    <input class="form-control mb-3"
                           type="file"
                           id="pdfFile"
                           accept=".pdf">

                    <p><strong>File:</strong> <span id="pdfName">-</span></p>
                    <p><strong>Pages:</strong> <span id="pageCount">-</span></p>

                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card h-100">
                <div class="card-body">

                    <h5>Paste Google Sheets Data</h5>

                    <textarea id="sheetData"
                              class="form-control mt-2"
                              placeholder="Paste directly from Google Sheets here..."></textarea>

                </div>
            </div>
        </div>

    </div>

    <div class="row g-4 mt-1">

        <div class="col-lg-4">

            <div class="card">
                <div class="card-body">

                    <h5>ZIP Settings</h5>

                    <label class="form-label">
                        ZIP File Name
                    </label>

                    <input type="text"
                           id="zipName"
                           class="form-control"
                           placeholder="Semester_3_Scripts">

                    <div class="mt-3">
                        <span id="validationStatus" class="text-muted">
                            Waiting for input...
                        </span>
                    </div>

                </div>
            </div>

        </div>

        <div class="col-lg-8">

            <div class="card">
                <div class="card-body">

                    <h5>Preview</h5>

                    <div class="preview-table">

                        <table class="table table-striped">

                            <thead>
                                <tr>
                                    <th>Start Page</th>
                                    <th>Name</th>
                                </tr>
                            </thead>

                            <tbody id="previewBody">
                            </tbody>

                        </table>

                    </div>

                </div>
            </div>

        </div>

    </div>

    <div class="text-center mt-4">

        <button class="btn btn-primary btn-lg"
                id="generateBtn"
                disabled>
            Generate PDFs
        </button>

    </div>

    <div class="card mt-4 d-none" id="summaryCard">

        <div class="card-body text-center">

            <h5>Generation Summary</h5>

            <p id="summaryText"></p>

            <button class="btn btn-success btn-lg"
                    id="downloadBtn">
                Download ZIP
            </button>

        </div>

    </div>

</div>

<div class="modal fade" id="messageModal" tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">
                    Message
                </h5>
                <button class="btn-close"
                        data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body" id="modalBody"></div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://unpkg.com/pdf-lib"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.5.136/pdf.min.mjs" type="module"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script src="script.js"></script>

</body>
</html>
